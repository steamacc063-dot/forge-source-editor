name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    name: Package (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: macos-latest, platform: mac, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: packages
          merge-multiple: true
      - name: Add source and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=Forge/ --output="packages/Forge-${TAG}-Source.zip" HEAD
          cd packages
          sha256sum * > SHA256SUMS.txt
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" packages/* --clobber
          gh release edit "$TAG" --draft=false --latest
